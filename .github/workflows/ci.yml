name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: JSON and YAML are valid and agree
        run: npm run validate
      - name: Spectral lint
        run: npx @stoplight/spectral-cli lint openapi.yaml --fail-severity=warn
      - name: Postman collection is up to date
        run: |
          node scripts/build-postman.mjs
          git diff --exit-code postman/
